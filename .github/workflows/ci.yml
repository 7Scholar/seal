name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lints and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Install the desktop system libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          SEAL_REQUIRE_TERMINAL: "1"
        run: cargo test --all-features

  frontend:
    name: Interface types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: The build must stay within the content-security policy
        run: |
          set -euo pipefail
          if grep -q '<script>' dist/index.html || grep -q '<style>' dist/index.html; then
            echo "The build emitted an inline script or style, which the strict policy blocks."
            exit 1
          fi
          if grep -rq 'data:' dist/index.html; then
            echo "The build emitted a data URI, which the strict policy blocks."
            exit 1
          fi

  installation:
    name: The published install route
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build the tool the release would ship
        run: cargo build --release -p seal-cli

      - name: Stand up a release the installer can actually download
        # The installer and the formula are only proven by driving them against a real
        # served release, so both are exercised here rather than merely read.
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p served
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign --force --sign - target/release/seal
          fi
          tar czf "served/seal-$triple.tar.gz" -C target/release seal
          cd served
          shasum -a 256 *.tar.gz > SHA256SUMS
          nohup python3 -m http.server 8799 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:8799/SHA256SUMS" && break
            sleep 1
          done

      - name: The installer must install a working binary
        run: |
          set -euo pipefail
          sed 's|https://github.com/$REPOSITORY/releases/latest/download|http://127.0.0.1:8799|' \
            scripts/install.sh > local-install.sh
          SEAL_INSTALL_DIR="$PWD/installed" sh local-install.sh
          "$PWD/installed/seal" --version
          "$PWD/installed/seal" --help | grep -q "open"

      - name: A tampered download must be refused
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          printf 'tampered' >> "served/seal-$triple.tar.gz"
          rm -rf installed
          if SEAL_INSTALL_DIR="$PWD/installed" sh local-install.sh; then
            echo "The installer accepted a download that does not match its checksum."
            exit 1
          fi
          test ! -e installed/seal

      - name: The formula must render and be valid
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p rendered
          for t in aarch64-apple-darwin x86_64-apple-darwin \
                   x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cp "served/seal-$triple.tar.gz" "rendered/seal-$t.tar.gz"
          done
          ./scripts/render-formula.sh 9.9.9 rendered > seal.rb
          cat seal.rb
          brew tap-new seal/citest --no-git
          cp seal.rb "$(brew --repository seal/citest)/Formula/seal.rb"
          HOMEBREW_NO_INSTALL_CLEANUP=1 brew audit --formula seal/citest/seal

  interoperability:
    name: Interoperability with the reference implementation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install the reference age implementation
        env:
          AGE_VERSION: v1.3.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" -o age.tar.gz
          tar -xzf age.tar.gz
          sudo install -m 0755 age/age /usr/local/bin/age
          age --version

      - name: Prove interoperability in both directions
        env:
          SEAL_REQUIRE_INTEROP: "1"
        run: cargo test -p seal-engine --test interop -- --nocapture

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
