name: Journeys

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  drive:
    name: Drive the journeys on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install exactly what the lockfile pins
        run: bun install --frozen-lockfile

      - name: Build the command-line tool into the bundle
        run: ./scripts/build-sidecar.sh

      - name: Build the application with the harness bridge
        run: bun run e2e:build

      - name: Drive every scenario against the real application, one at a time
        run: |
          set -euo pipefail
          for scenario in \
            e2e e2e:extended e2e:interrupted e2e:living e2e:frame \
            e2e:expiry e2e:settling e2e:deploy e2e:badday \
            e2e:filter e2e:freshness e2e:largefile e2e:density
          do
            echo "::group::$scenario"
            pkill -x seal-desktop || true
            sleep 2
            bun run "$scenario"
            echo "::endgroup::"
          done
          pkill -x seal-desktop || true

      - name: The distributable build must not contain the harness bridge
        run: |
          set -euo pipefail
          cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol
          if strings target/release/seal-desktop | grep -qi "webdriver"; then
            echo "The distributable binary contains the WebDriver bridge."
            exit 1
          fi
