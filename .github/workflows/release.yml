name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    name: Command-line tool for ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p seal-cli --target ${{ matrix.triple }}

      - name: Sign so Apple Silicon will execute it
        # Ad-hoc, not Developer ID: it satisfies the execution gate that kills unsigned
        # arm64 code, and costs nothing. It does not pass Gatekeeper — see packaging.md.
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/${{ matrix.triple }}/release/seal"

      - name: Package as a tarball, never a bare binary or a zip
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          mkdir -p artefacts
          tar czf "artefacts/seal-$triple.tar.gz" -C "target/$triple/release" seal
          cd artefacts
          shasum -a 256 "seal-$triple.tar.gz" > "seal-$triple.tar.gz.sha256"
          cat "seal-$triple.tar.gz.sha256"

      - name: The tarball must actually run after a simulated download
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          triple="${{ matrix.triple }}"
          work="$(mktemp -d)"
          cp "artefacts/seal-$triple.tar.gz" "$work/"
          cd "$work"
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "seal-$triple.tar.gz"
          tar xzf "seal-$triple.tar.gz"
          if xattr seal | grep -q com.apple.quarantine; then
            echo "The extracted binary carries quarantine and macOS will refuse to run it."
            exit 1
          fi
          codesign --verify seal
          ./seal --version

      - name: It must run on Linux too
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar xzf "artefacts/seal-${{ matrix.triple }}.tar.gz" -C "$work"
          "$work/seal" --version

      - uses: actions/upload-artifact@v4
        with:
          name: seal-cli-${{ matrix.triple }}
          path: artefacts/

  bundle:
    name: Unsigned application bundle for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the desktop system libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Build the command-line tool into the bundle
        run: ./scripts/build-sidecar.sh

      - name: Bundle
        run: npx --yes @tauri-apps/cli@2 build

      - name: Checksum every artefact
        # These bundles are unsigned and macOS will refuse to open them. They exist so a
        # contributor can check a build, not for users to download — see packaging.md.
        run: |
          set -euo pipefail
          mkdir -p artefacts
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} artefacts/ \;
          cd artefacts
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: seal-app-unsigned-${{ matrix.os }}
          path: artefacts/

  publish:
    name: Publish the release
    needs: [cli, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version the workspace declares
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the declared version $declared."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect the command-line tarballs and checksum them together
        # Only the command-line tool is published for people to install. The unsigned
        # bundles stay as workflow artefacts a contributor can fetch — publishing them
        # would offer users a download macOS refuses to open. See packaging.md.
        run: |
          set -euo pipefail
          mkdir -p release
          find downloaded -name 'seal-*.tar.gz' -exec cp {} release/ \;
          cd release
          shasum -a 256 *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(ls *.tar.gz | wc -l)" -eq 4

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Seal $version" \
            --notes "Install the command-line tool:

          \`\`\`bash
          brew install 7scholar/tap/seal
          \`\`\`

          or, without Homebrew:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | sh
          \`\`\`

          Verify a download against \`SHA256SUMS\`. The desktop application is built from source — see the README.

          The command-line binaries are ad-hoc signed rather than notarised, so macOS runs them when they arrive by Homebrew, the installer script or \`tar\`, but refuses them if a browser downloads them." \
            release/*.tar.gz release/SHA256SUMS

  tap:
    name: Update the Homebrew tap
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Render the formula against the published tarballs
        run: |
          set -euo pipefail
          mkdir -p rendered
          find downloaded -name 'seal-*.tar.gz' -exec cp {} rendered/ \;
          ./scripts/render-formula.sh "${GITHUB_REF_NAME#v}" rendered > seal.rb
          cat seal.rb

      - name: Push it to the tap
        # SEAL_TAP_TOKEN is a token with contents write on the tap repository. Without it
        # the formula is rendered and checked but not pushed, so a fork's release still works.
        env:
          TAP_TOKEN: ${{ secrets.SEAL_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "No SEAL_TAP_TOKEN is set, so the tap is not updated."
            echo "The formula above is correct; publish it by hand or set the secret."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/7scholar/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp seal.rb tap/Formula/seal.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/seal.rb
          if git diff --cached --quiet; then
            echo "The formula is already current."
            exit 0
          fi
          git commit -m "seal ${GITHUB_REF_NAME#v}"
          git push
