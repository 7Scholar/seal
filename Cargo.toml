[workspace]
resolver = "2"
members = ["crates/seal-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7scholar/seal"

[workspace.dependencies]
thiserror = "2"

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
