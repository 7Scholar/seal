[workspace]
resolver = "2"
members = ["crates/seal-engine", "crates/seal-registry", "crates/seal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7scholar/seal"

[workspace.dependencies]
thiserror = "2"
age = { version = "0.12", features = ["armor"] }
secrecy = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
rpassword = "7.5"

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
