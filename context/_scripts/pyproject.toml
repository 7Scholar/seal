[project]
name = "context-scripts"
version = "0.1.0"
description = "Tooling for the context/ system: plan-folder coverage/drift detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
add_to_coverage = "plans.add_to_coverage:main"
remove_from_coverage = "plans.remove_from_coverage:main"
set_boundary = "plans.set_boundary:main"
run_coverage = "plans.run_coverage:main"
find_plans = "plans.find_plans:main"
install_hook = "hooks.install_hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plans", "hooks"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]  # E: pycodestyle errors, F: pyflakes, I: isort
ignore = []
